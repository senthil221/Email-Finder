# Email Finder on the VPS: Postgres + web app + worker.
# The web app joins the existing Traefik network (from the n8n stack) for HTTPS.
# Settings come from .env next to this file (see .env.example).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: emailfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: emailfinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailfinder -d emailfinder"]
      interval: 5s
      retries: 20
    networks: [internal]

  web:
    build: .
    image: email-finder:latest
    restart: unless-stopped
    command: ["node", "server.js"]
    environment:
      DATABASE_URL: postgresql://emailfinder:${POSTGRES_PASSWORD}@db:5432/emailfinder
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      MTN_DAILY_LIMIT: ${MTN_DAILY_LIMIT:-200000}
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.emailfinder.rule=Host(`${APP_HOST:?set APP_HOST in .env}`)
      - traefik.http.routers.emailfinder.entrypoints=web,websecure
      - traefik.http.routers.emailfinder.tls=true
      - traefik.http.routers.emailfinder.tls.certresolver=mytlschallenge
      - traefik.http.services.emailfinder.loadbalancer.server.port=3000

  worker:
    image: email-finder:latest
    pull_policy: never
    restart: unless-stopped
    command: ["node", "worker.js"]
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgresql://emailfinder:${POSTGRES_PASSWORD}@db:5432/emailfinder
      MTN_API_KEY: ${MTN_API_KEY:-}
      MTN_RATE_MAX: ${MTN_RATE_MAX:-23}
      MTN_RATE_WINDOW_MS: ${MTN_RATE_WINDOW_MS:-10000}
      MTN_DAILY_LIMIT: ${MTN_DAILY_LIMIT:-200000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-12}
      RETRY_DELAY_MS: ${RETRY_DELAY_MS:-20000}
    depends_on:
      db: { condition: service_healthy }
      web: { condition: service_started }
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
  traefik:
    name: n8n_default
    external: true
